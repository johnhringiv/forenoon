{% extends "base.html" %}
{% block title %}Sign in · Forenoon{% endblock %}
{% block header %}<p>Sign in to see your newsstand.</p>{% endblock %}
{% block main %}
{% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
<form class="sheet" method="post" action="/login">
<label>Name <input name="id" value="{{ id }}" maxlength="64" autocomplete="username" autocapitalize="none" required autofocus></label>
<label>Password <input name="password" type="password" maxlength="256" autocomplete="current-password" required></label>
<button>Sign in</button>
</form>
{% endblock %}
