{% extends "base.html" %}
{% block title %}New password · Forenoon{% endblock %}
{% block header %}<p>Choose a new password.</p>{% endblock %}
{% block main %}
{% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
<form class="sheet" method="post" action="/reset/{{ token }}">
<label>New password <input name="password" type="password" minlength="10" maxlength="256" autocomplete="new-password" required autofocus></label>
<label>New password again <input name="again" type="password" minlength="10" maxlength="256" autocomplete="new-password" required></label>
<p class="hint">At least 10 characters. This signs the account out everywhere.</p>
<button class="primary">Change password</button>
</form>
{% endblock %}
