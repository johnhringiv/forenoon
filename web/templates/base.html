<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Forenoon{% endblock %}</title>
<style>
:root { --bg:#f6f4ef; --card:#fff; --ink:#1c1b19; --soft:#6b675f; --line:#dedad0; --accent:#8a3b12 }
@media (prefers-color-scheme:dark) {
  :root { --bg:#161513; --card:#201f1c; --ink:#ece8df; --soft:#a39e93; --line:#35332e; --accent:#e0a074 }
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,sans-serif }
header, main { max-width:1180px; margin:0 auto; padding:0 16px }
header { padding-top:28px; padding-bottom:8px; border-bottom:3px double var(--line) }
h1 { font:700 2.1rem/1.1 Georgia,serif; margin:0; letter-spacing:.01em; display:flex; align-items:center; gap:.6rem }
h1 a { color:inherit; text-decoration:none }
h1 svg { color:var(--accent) }
header p { margin:.4rem 0 .6rem; color:var(--soft); font-size:.9rem }
h2 { font:700 1.15rem Georgia,serif; margin:2rem 0 .8rem; display:flex; gap:.6rem; align-items:baseline }
h2 span { font:400 .85rem system-ui,sans-serif; color:var(--soft) }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px }
article { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden;
  display:flex; flex-direction:column }
article img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--line) }
.body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:.45rem; flex:1 }
.kicker { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent);
  overflow-wrap:anywhere; margin:0 }
h3 { font:700 1.08rem/1.25 Georgia,serif; margin:0; overflow-wrap:anywhere }
h3 a { color:inherit; text-decoration:none }
h3 a:hover { text-decoration:underline }
.desc { margin:0; font-size:.88rem; color:var(--soft); overflow-wrap:anywhere }
.why { margin:0; font-size:.84rem; font-style:italic; overflow-wrap:anywhere }
.meta { margin-top:auto; padding-top:.5rem; border-top:1px solid var(--line); font-size:.78rem;
  color:var(--soft); display:flex; flex-wrap:wrap; gap:.3rem .8rem }
.tag { border:1px solid var(--line); border-radius:3px; padding:0 .35rem }
.rated { color:var(--ink); font-weight:600 }
nav { margin:2rem 0 3rem; display:flex; gap:1.2rem; font-size:.95rem }
a { color:var(--accent) }
.empty { margin:3rem 0; color:var(--soft) }
.bar { font-size:.9rem; margin:0 0 .6rem; display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:center }
.bar b { color:var(--ink) }
.bar .who { margin-left:auto; display:flex; gap:1rem; align-items:center; color:var(--soft) }
button, select, input { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:3px }
button, select { padding:.15rem .45rem; cursor:pointer }
form.rate { margin:0; display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; font-size:.78rem }
form.rate button.on { background:var(--ink); color:var(--card); border-color:var(--ink) }
.gap { margin-left:.5rem }
button.link { border:0; background:none; padding:0; color:var(--accent); text-decoration:underline }
form.sheet { max-width:24rem; margin:2rem 0; display:flex; flex-direction:column; gap:.8rem }
form.sheet label { display:flex; flex-direction:column; gap:.25rem; font-size:.9rem }
form.sheet input, form.sheet textarea { padding:.45rem .55rem }
form.sheet.wide { max-width:44rem }
textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:3px;
  resize:vertical }
form.sheet button { align-self:flex-start; padding:.4rem 1rem }
form.sheet h2 { margin:0 }
.error { color:#b3261e; margin:1rem 0 0 }
.notice { color:var(--accent); margin:1rem 0 0 }
.hint { font-size:.8rem; color:var(--soft); margin:0 }
</style>
</head>
<body>
<header>
<h1><svg viewBox="0 0 48 32" width="48" height="32" aria-hidden="true"><path d="M10 24a14 14 0 0 1 28 0z" fill="currentColor"/><path d="M2 28h44" stroke="currentColor" stroke-width="2.5"/><path d="M24 2v5M6 10l4 3M42 10l-4 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><a href="/">Forenoon</a></h1>
{% block header %}{% endblock %}
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
