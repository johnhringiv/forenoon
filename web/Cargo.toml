[package]
name = "forenoon-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.6"
askama = "0.16"
axum = "0.8"
axum-login = "0.18"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
percent-encoding = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "net", "signal"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
percent-encoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[profile.release]
strip = true
lto = "thin"
