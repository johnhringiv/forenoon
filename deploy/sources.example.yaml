# Feed URLs verified 2026-10-10. tier: clean | email | discovery (only clean is used in Phase 0).
# extract: auto (default) picks the fuller of page and feed; page / feed force one.
sources:
  - {name: Embrace The Red, url: "https://embracethered.com/blog/index.xml"}
  - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/"}
  - {name: Trail of Bits, url: "https://blog.trailofbits.com/feed/"}
  - {name: Google Project Zero, url: "https://projectzero.google/feed.xml"}
  - {name: Hamel Husain, url: "https://hamel.dev/index.xml"}
  - {name: Ralf Jung, url: "https://www.ralfj.de/blog/feed.xml"}
  - {name: matklad, url: "https://matklad.github.io/feed.xml"}
  - {name: Daniel Lemire, url: "https://lemire.me/blog/feed/"}
  - {name: Eli Bendersky, url: "https://eli.thegreenplace.net/feeds/all.atom.xml"}
  - {name: Modular, url: "https://www.modular.com/blog/rss.xml"}
  # JetBrains feeds carry the full article, so skip the page fetch (fewer requests to a
  # host that challenges bursts with HTTP 202).
  - {name: JetBrains AI, url: "https://blog.jetbrains.com/ai/feed/", extract: feed}
  - {name: JetBrains Rust, url: "https://blog.jetbrains.com/rust/feed/", extract: feed}
  - {name: Geoffrey Huntley, url: "https://ghuntley.com/rss/"}
  - {name: Fernando Borretti, url: "https://borretti.me/feed.xml"}
  - {name: Monochrome Watches, url: "https://monochrome-watches.com/feed/"}
  - {name: Worn & Wound, url: "https://wornandwound.com/feed/"}
  - {name: Hodinkee, url: "https://www.hodinkee.com/articles/rss.xml"}
  - {name: aBlogtoWatch, url: "https://www.ablogtowatch.com/feed/"}

  # Must-deliver: bypasses selection order, always first.
  - {name: A Cathedral in the Wild, url: "https://shearerp.substack.com/feed", pinned: true}

  # News: feeds are partial text, so extract from the page.
  - {name: Ars Technica Security, url: "https://arstechnica.com/security/feed/", extract: page}
  - {name: Ars Technica AI, url: "https://arstechnica.com/ai/feed/", extract: page}
  # Wired and the FT are not fetched here: they will come from Calibre news recipes
  # in a later phase.
