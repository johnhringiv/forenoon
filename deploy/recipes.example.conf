# Copy to <data>/recipes/recipes.conf. One line per publication:
#
#   folder = Recipe name
#
# "folder" is where its issues are written (<data>/recipes/<folder>/) and what the matching
# source names on the web pages' Sources page (tick "Calibre recipe", folder: wired)
# "Recipe name" is a built-in Calibre recipe (list them with
#   docker exec forenoon-recipes ebook-convert --list-recipes
# ) or the file name of your own .recipe file placed in this folder.
#
# Logins never go here. For a folder "ft" put RECIPE_FT_USERNAME and RECIPE_FT_PASSWORD in
# recipes.env.

wired = Wired Daily Edition
# ft = Financial Times
