# Forenoon. Copy .env.example to .env and fill it in first.
# The data folder (FORENOON_HOST_DATA) must be writable by UID 1000 (or by PUID:PGID if you
# set them). Everything else is set on the web pages.
name: forenoon

x-app: &app
  build: ..
  image: forenoon:local
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  # Default bridge, not a compose-created network: Synology's DSM firewall drops egress
  # from custom bridge networks (DNS and all traffic time out).
  network_mode: bridge
  volumes:
    - ${FORENOON_HOST_DATA}:/data

services:
  forenoon:
    <<: *app
    command: ["schedule"]
    environment:
      TZ: ${TZ:-UTC}
      FORENOON_FEEDBACK_SECRET: ${FORENOON_FEEDBACK_SECRET:?set in .env}
      FORENOON_ANTHROPIC_API_KEY: ${FORENOON_ANTHROPIC_API_KEY:-}
      # One line per model connection that needs a key (Settings page), named after it:
      # FORENOON_LLM_KEY_LAN: ${FORENOON_LLM_KEY_LAN:-}
      # Where rating links point: the web pages' public address.
      FORENOON_PUBLIC_URL: ${FORENOON_PUBLIC_URL:-}
      # The mail server books and alerts are sent through; see docs/setup-email.md.
      FORENOON_SMTP_HOST: ${FORENOON_SMTP_HOST:-}
      FORENOON_SMTP_PORT: ${FORENOON_SMTP_PORT:-587}
      FORENOON_SMTP_USERNAME: ${FORENOON_SMTP_USERNAME:-}
      FORENOON_SMTP_SENDER: ${FORENOON_SMTP_SENDER:-}
      FORENOON_SMTP_PASSWORD: ${FORENOON_SMTP_PASSWORD:-}
      FORENOON_SMTP_MAX_MESSAGE_BYTES: ${FORENOON_SMTP_MAX_MESSAGE_BYTES:-}
      FORENOON_SMTP_IMPLICIT_TLS: ${FORENOON_SMTP_IMPLICIT_TLS:-false}

  # The pages, behind a login, and the answer to the rating links in each book. Create the
  # first account with:
  #   docker compose exec web forenoon-web add-user <id> --email <address>
  web:
    build: ../web
    image: ${WEB_IMAGE:-forenoon-web:local}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    network_mode: bridge
    volumes:
      - ${FORENOON_HOST_DATA}:/data
      # Session cookies: written here, read by the browser container, seen by nothing else.
      - logins:/logins
    # For your own reverse proxy, or the LAN. With the tunnel alone this can stay on 127.0.0.1.
    ports: ["${WEB_LISTEN:-127.0.0.1:8081}:8081"]
    environment:
      TZ: ${TZ:-UTC}
      # Checks the rating links the pipeline signs.
      FORENOON_FEEDBACK_SECRET: ${FORENOON_FEEDBACK_SECRET:?set in .env}
      # Served over https (the tunnel, or a proxy of your own): the session cookie is sent
      # only that way. Signing in over plain http then does not work.
      FORENOON_WEB_SECURE_COOKIES: ${FORENOON_WEB_SECURE_COOKIES:-false}
      # The header a proxy in front gives the client's address in, and the addresses it is
      # believed from. The defaults fit the tunnel: cloudflared shares this container's network
      # namespace and is the only thing that reaches the pages from 127.0.0.1, so without it
      # the header is never believed. For your own proxy, set both.
      FORENOON_WEB_CLIENT_IP_HEADER: ${FORENOON_WEB_CLIENT_IP_HEADER:-CF-Connecting-IP}
      FORENOON_WEB_TRUSTED_PROXIES: ${FORENOON_WEB_TRUSTED_PROXIES:-127.0.0.1,::1}
      # For the links in account emails. They go through the same mail server as the books;
      # without a host they are written to this container's log instead.
      FORENOON_WEB_URL: ${FORENOON_WEB_URL:-}
      FORENOON_SMTP_HOST: ${FORENOON_SMTP_HOST:-}
      FORENOON_SMTP_PORT: ${FORENOON_SMTP_PORT:-587}
      FORENOON_SMTP_USERNAME: ${FORENOON_SMTP_USERNAME:-}
      FORENOON_SMTP_SENDER: ${FORENOON_SMTP_SENDER:-}
      FORENOON_SMTP_PASSWORD: ${FORENOON_SMTP_PASSWORD:-}
      FORENOON_SMTP_IMPLICIT_TLS: ${FORENOON_SMTP_IMPLICIT_TLS:-false}
      # A public demo: hostnames at which a reader's pages are shown read-only to anyone.
      FORENOON_WEB_DEMO: ${FORENOON_WEB_DEMO:-}
      # The public site: the hostname the project's landing page is served at.
      FORENOON_WEB_LANDING: ${FORENOON_WEB_LANDING:-}

  # Enabled by adding "browser" to COMPOSE_PROFILES in .env. Reads article pages with Chrome,
  # signed in as the reader, for the sites given a subscriber session on the Sources page;
  # see docs/setup-sessions.md. It is the only container that can read a session's cookie.
  browser:
    build: ../browser
    image: ${BROWSER_IMAGE:-forenoon-browser:local}
    profiles: [browser]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    network_mode: bridge
    volumes:
      - ${FORENOON_HOST_DATA}/sessions:/sessions
      - logins:/logins:ro
      # What the browser keeps of a sign-in. Only this container mounts it.
      - browser:/browser
    environment:
      TZ: ${TZ:-UTC}

  # Enabled by COMPOSE_PROFILES=cloudflared in .env.
  # In the Cloudflare dashboard, route the public hostname to http://localhost:8081
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    profiles: [cloudflared]
    restart: unless-stopped
    # Shares the web container's network namespace, so localhost:8081 is the pages.
    network_mode: "service:web"
    depends_on: [web]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # :- not :? because compose interpolates this file even when the profile is off
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  # Not in the data folder on purpose: the pipeline, which reads untrusted pages, mounts that.
  logins:
    name: forenoon-logins
  browser:
    name: forenoon-browser
