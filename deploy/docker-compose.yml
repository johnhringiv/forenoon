# Forenoon, Phase 0. Copy .env.example to .env and fill it in first.
# The data folder (FORENOON_HOST_DATA) must be writable by UID 1000 (or by PUID:PGID if you
# set them). Everything else is set on the web pages.
name: forenoon

x-app: &app
  build: ..
  image: forenoon:local
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  # Default bridge, not a compose-created network: Synology's DSM firewall drops egress
  # from custom bridge networks (DNS and all traffic time out).
  network_mode: bridge
  volumes:
    - ${FORENOON_HOST_DATA}:/data

services:
  forenoon:
    <<: *app
    command: ["schedule"]
    environment:
      TZ: ${TZ:-UTC}
      FORENOON_FEEDBACK_SECRET: ${FORENOON_FEEDBACK_SECRET:?set in .env}
      FORENOON_ANTHROPIC_API_KEY: ${FORENOON_ANTHROPIC_API_KEY:-}
      # Where rating links point: the feedback service's public address.
      FORENOON_PUBLIC_URL: ${FORENOON_PUBLIC_URL:-}
      # The mail server books and alerts are sent through; see docs/setup-email.md.
      FORENOON_SMTP_HOST: ${FORENOON_SMTP_HOST:-}
      FORENOON_SMTP_PORT: ${FORENOON_SMTP_PORT:-587}
      FORENOON_SMTP_USERNAME: ${FORENOON_SMTP_USERNAME:-}
      FORENOON_SMTP_SENDER: ${FORENOON_SMTP_SENDER:-}
      FORENOON_SMTP_PASSWORD: ${FORENOON_SMTP_PASSWORD:-}
      FORENOON_SMTP_MAX_MESSAGE_BYTES: ${FORENOON_SMTP_MAX_MESSAGE_BYTES:-}

  feedback:
    <<: *app
    command: ["feedback", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      FORENOON_FEEDBACK_SECRET: ${FORENOON_FEEDBACK_SECRET:?set in .env}
    # No published port: the tunnel below is the only way in. For your own reverse proxy
    # instead, add  ports: ["127.0.0.1:8080:8080"]

  # Enabled by adding "web" to COMPOSE_PROFILES in .env. The newsstand pages, behind a login;
  # create the first account with:
  #   docker compose exec web forenoon-web add-user <id> --email <address>
  # Publish them only on a trusted network for now, never through the tunnel.
  web:
    build: ../web
    image: ${WEB_IMAGE:-forenoon-web:local}
    profiles: [web]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    network_mode: bridge
    volumes:
      - ${FORENOON_HOST_DATA}:/data
      # Recipe logins: written here, read by the recipes container, seen by nothing else.
      - logins:/logins
    ports: ["${WEB_LISTEN:-127.0.0.1:8081}:8081"]
    environment:
      TZ: ${TZ:-UTC}
      # For the links in account emails. They go through the same mail server as the books;
      # without a host they are written to this container's log instead.
      FORENOON_WEB_URL: ${FORENOON_WEB_URL:-}
      FORENOON_SMTP_HOST: ${FORENOON_SMTP_HOST:-}
      FORENOON_SMTP_PORT: ${FORENOON_SMTP_PORT:-587}
      FORENOON_SMTP_USERNAME: ${FORENOON_SMTP_USERNAME:-}
      FORENOON_SMTP_SENDER: ${FORENOON_SMTP_SENDER:-}
      FORENOON_SMTP_PASSWORD: ${FORENOON_SMTP_PASSWORD:-}

  # Enabled by adding "recipes" to COMPOSE_PROFILES in .env. Runs Calibre news recipes into
  # <data>/recipes; see docs/setup-recipes.md. Which recipes, and their logins, are set on
  # the web pages' Sources page. It also fetches article pages for feeds that carry a
  # subscriber's session, being the only container that can read one.
  recipes:
    build: ../recipes
    image: ${RECIPES_IMAGE:-forenoon-recipes:local}
    profiles: [recipes]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    network_mode: bridge
    volumes:
      - ${FORENOON_HOST_DATA}/recipes:/recipes
      - logins:/logins:ro
      # What the browser keeps of a sign-in. Only this container mounts it.
      - browser:/browser
    environment:
      TZ: ${TZ:-UTC}
      RECIPES_TIME: ${RECIPES_TIME:-05:00}

  # Enabled by COMPOSE_PROFILES=cloudflared in .env.
  # In the Cloudflare dashboard, route the public hostname to http://localhost:8080
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    profiles: [cloudflared]
    restart: unless-stopped
    # Shares the feedback container's network namespace, so localhost:8080 is the service.
    network_mode: "service:feedback"
    depends_on: [feedback]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # :- not :? because compose interpolates this file even when the profile is off
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  # Not in the data folder on purpose: the pipeline, which reads untrusted pages, mounts that.
  logins:
    name: forenoon-logins
  browser:
    name: forenoon-browser
