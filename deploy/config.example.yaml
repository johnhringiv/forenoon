# Forenoon configuration. Secrets are NOT set here: see .env.example.
timezone: America/New_York
delivery_time: "06:00"          # local time of the daily run (`forenoon schedule`)
data_dir: data                   # relative to this file; overridden by FORENOON_DATA_DIR
sources_file: sources.yaml

# Public URL of the feedback service (Cloudflare Tunnel hostname). Leave empty to
# deliver without feedback links.
public_base_url: ""

# issue: one book a day with a contents page and a chapter per article.
# articles: one book per article.
format: issue

max_age_days: 3                  # ignore feed items older than this
token_ttl_days: 60               # how long feedback links stay valid
keep_pages_days: 90              # keep each fetched page this long for `forenoon replay`; 0 = none

users:
  - id: me
    name: Me
    daily_cap: 8                 # articles per day
    kindle_addresses:
      - your-name@kindle.com     # must be registered here; nothing else can pick a recipient
    # What you want to read, in your own words. Used only when `llm.enabled` is true.
    interests: |
      Compilers and programming-language design. Practical LLM engineering.
      Less interested in product announcements.

smtp:                            # example values are for Resend; see docs/setup-email.md
  host: smtp.resend.com
  port: 587
  starttls: true
  username: resend               # the API key goes in FORENOON_SMTP_PASSWORD
  sender: digest@example.com     # must be on Amazon's Approved Personal Document E-mail List
  max_message_bytes: 38000000    # Resend accepts 40 MB after encoding

# Ranking with Claude: the model scores each candidate's title and opening words against your
# interests and recent ratings. Needs FORENOON_ANTHROPIC_API_KEY in the environment. When it
# is off, over its cap or failing, articles go newest first as before.
llm:
  enabled: false
  model: claude-haiku-5-5
  daily_token_cap: 200000        # input + output tokens per day; a ranking call is skipped
                                 # when it would cross this
  max_candidates: 80             # abstracts sent per user per run
  explore_slots: 1               # the day's last slot goes to a random lower-ranked article
  show_reasons: true             # print the model's one-line reason in the book
  check_extraction: true         # one more call per run asks whether each article looks
                                 # complete; logged in the report, never changes delivery

# Discovery: the front pages of Hacker News and Lobsters are added to the day's candidates
# and scored in the same ranking call. Only used when ranking is on and working.
discovery:
  enabled: false
  sites: [hackernews, lobsters]
  slots: 2                       # at most this many of the day's articles (never over half)
  min_score: 6                   # a found article must score at least this (0 to 10)
  per_site: 25                   # candidates sent to the model per site

# Operator notices by email, through the same relay: failed delivery, a crashed run, a run
# with nothing to deliver, or a source failing several runs in a row. Off while `to` is empty.
alerts:
  to: ""                         # your own address
  source_failures: 3             # consecutive failed runs before a source is reported
  on_empty: true                 # also tell me when there was nothing new to deliver

images:
  grayscale: true                # false for colour e-readers
  max_width: 1200
  max_height: 1600
