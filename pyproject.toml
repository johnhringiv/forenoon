[project]
name = "forenoon"
version = "0.0.1"
description = "Self-hosted reading digest delivered to e-readers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0.11",
    "fonttools>=4.67.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "pillow>=10.4",
    "readability-lxml>=0.9",
    "regex>=2026.9.29",
    "resvg-py>=0.5.0",
    "trafilatura>=2.0",
]

[project.scripts]
forenoon = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
