name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a release tag publishes a matching image tag (v1 → :v1)
  pull_request:
  schedule:
    - cron: "41 4 5 * *" # monthly rebuild so the image picks up base-image CVE fixes

# One run per branch at a time; a newer push cancels the older run. Without this, two merges
# close together publish concurrently and the older can finish last, leaving :latest behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each image is built once. Its job smoke-tests it and, on main and release tags, pushes that
# same image as :sha-<commit>; publish then points :latest (or :v1) at it once every check has
# passed. What the host deploys is what was tested, and the monthly no-cache build runs once.
env:
  PUBLISH: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'schedule') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes full version tags only
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Markdown is prettier-formatted (the pre-commit hook in .githooks does it locally).
      - name: Check Markdown formatting
        run: git ls-files -z '*.md' | xargs -0 npx --yes prettier@3 --check

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the tested image on main
    steps:
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # No build time, commit, repository description or event (main, nightly, v1) in the
          # labels: an image whose layers did not change keeps its digest, so the host's poller
          # leaves its container running. The :sha-<commit> tag still says which commit it is.
          labels: |
            org.opencontainers.image.created=
            org.opencontainers.image.revision=
            org.opencontainers.image.description=
            org.opencontainers.image.version=
      - uses: docker/setup-buildx-action@v4 # container driver; required for the gha build cache
      - uses: docker/build-push-action@v7
        with:
          # No attestations: they carry the build's time, and would change the digest every run.
          provenance: false
          sbom: false
          context: .
          load: true
          tags: forenoon:ci
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }} # the CVE rebuild must not be cached
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same hardening flags as deploy.sh, so a write outside /data or /tmp fails here.
      - name: Render the golden test article
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            forenoon:ci golden --out /tmp/out
      # The image's fonts reach the book: code in the code font, emoji in the emoji font.
      - name: The golden book embeds the code and emoji fonts
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --entrypoint sh forenoon:ci -c \
            'forenoon golden --out /tmp/out >/dev/null && python -c "import glob, zipfile; \
            names = zipfile.ZipFile(glob.glob(\"/tmp/out/*.epub\")[0]).namelist(); \
            assert {\"OEBPS/fonts/code.ttf\", \"OEBPS/fonts/emoji.ttf\"} <= set(names), names"'
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image as :sha-<commit>
        if: env.PUBLISH == 'true'
        run: |
          tag=ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}
          docker tag forenoon:ci "$tag"
          docker push "$tag"

  browser:
    name: Browser image build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the tested image on main
    steps:
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-browser
          # No build time, commit, repository description or event (main, nightly, v1) in the
          # labels: an image whose layers did not change keeps its digest, so the host's poller
          # leaves its container running. The :sha-<commit> tag still says which commit it is.
          labels: |
            org.opencontainers.image.created=
            org.opencontainers.image.revision=
            org.opencontainers.image.description=
            org.opencontainers.image.version=
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          # No attestations: they carry the build's time, and would change the digest every run.
          provenance: false
          sbom: false
          context: browser
          load: true
          tags: forenoon-browser:ci
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }} # also how a newer Chrome is picked up
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
      # With the deploy's hardening, as the reader's user: the screen starts and Chrome draws a page.
      - name: The browser starts on its own screen
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /browser:uid=1000,gid=1000 --entrypoint python3 forenoon-browser:ci -c '
          import sys; sys.path.insert(0, "/usr/local/bin"); import fetcher
          from playwright.sync_api import sync_playwright
          fetcher._start_display()
          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, args=["--disable-dev-shm-usage"])
              page = b.new_page(); page.set_content("<title>ok</title>")
              assert page.title() == "ok" and "Headless" not in page.evaluate("navigator.userAgent")
              b.close()
          print("browser ok")'
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image as :sha-<commit>
        if: env.PUBLISH == 'true'
        run: |
          tag=ghcr.io/${{ github.repository }}-browser:sha-${GITHUB_SHA::7}
          docker tag forenoon-browser:ci "$tag"
          docker push "$tag"

  web:
    name: Web app checks
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true" # queries are checked against web/.sqlx, not a live database
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - run: cargo fmt --check
        working-directory: web
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: web
      - run: cargo test --locked
        working-directory: web

  # Apart from the checks so the two run side by side: the image compiles in its own build
  # stage and takes nothing from the job above.
  web-image:
    name: Web image build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the tested image on main
    steps:
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-web
          # No build time, commit, repository description or event (main, nightly, v1) in the
          # labels: an image whose layers did not change keeps its digest, so the host's poller
          # leaves its container running. The :sha-<commit> tag still says which commit it is.
          labels: |
            org.opencontainers.image.created=
            org.opencontainers.image.revision=
            org.opencontainers.image.description=
            org.opencontainers.image.version=
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          # No attestations: they carry the build's time, and would change the digest every run.
          provenance: false
          sbom: false
          context: web
          load: true
          tags: forenoon-web:ci
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # Same hardening flags as deploy.sh. An account is created, then the server must
      # answer its own health check.
      - name: Create an account and answer the health check
        run: |
          mkdir -m 777 webdata
          flags="--read-only --tmpfs /tmp --cap-drop ALL -v $PWD/webdata:/data"
          echo "a password for ci" | docker run --rm -i $flags forenoon-web:ci add-user ci --email ci@example.com
          docker run --rm $flags forenoon-web:ci users | grep -q "^ci .*admin .*ci@example.com"
          docker run -d --name web $flags forenoon-web:ci serve
          for i in $(seq 1 20); do
            if docker exec web forenoon-web health; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image as :sha-<commit>
        if: env.PUBLISH == 'true'
        run: |
          tag=ghcr.io/${{ github.repository }}-web:sha-${GITHUB_SHA::7}
          docker tag forenoon-web:ci "$tag"
          docker push "$tag"

  # Points :latest (newest main, what the host deploys) and a release tag (v1 → :v1) at the
  # images the jobs above tested and pushed as :sha-<commit>. Nothing is rebuilt here. The host
  # polls :latest and redeploys when the digest changes; see docs/setup-deploy.md.
  publish:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [checks, docker, browser, web, web-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested images
        run: |
          for image in ghcr.io/${{ github.repository }}{,-browser,-web}; do
            tags=()
            if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(-t "$image:latest"); fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$image:$GITHUB_REF_NAME"); fi
            docker buildx imagetools create "${tags[@]}" "$image:sha-${GITHUB_SHA::7}"
          done
