name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a release tag publishes a matching image tag (v1 → :v1)
  pull_request:
  schedule:
    - cron: "41 4 5 * *" # monthly rebuild so the image picks up base-image CVE fixes

# One run per branch at a time; a newer push cancels the older run. Without this, two merges
# close together publish concurrently and the older can finish last, leaving :latest behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Markdown is prettier-formatted (the pre-commit hook in .githooks does it locally).
      - name: Check Markdown formatting
        run: git ls-files -z '*.md' | xargs -0 npx --yes prettier@3 --check

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4 # container driver; required for the gha build cache
      # Shares the GHA build cache with the publish job.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: forenoon:ci
          no-cache: ${{ github.event_name == 'schedule' }} # the CVE rebuild must not be cached
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same hardening flags as deploy.sh, so a write outside /data or /tmp fails here.
      - name: Render the golden test article
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            forenoon:ci golden --out /tmp/out
      - name: Feedback service answers its health check
        run: |
          docker run -d --name feedback --read-only --tmpfs /tmp --tmpfs /data:uid=1000,gid=1000 \
            --cap-drop ALL -e FORENOON_FEEDBACK_SECRET="$(openssl rand -hex 32)" \
            forenoon:ci feedback --port 8080
          for i in $(seq 1 20); do
            if docker exec feedback python -c \
              "import urllib.request as u; u.urlopen('http://localhost:8080/healthz', timeout=3)"; then
              exit 0
            fi
            sleep 1
          done
          docker logs feedback
          exit 1

  recipes:
    name: Recipes image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: recipes
          load: true
          tags: forenoon-recipes:ci
          no-cache: ${{ github.event_name == 'schedule' }} # also how a newer Calibre is picked up
          cache-from: type=gha,scope=recipes
          cache-to: type=gha,mode=max,scope=recipes
      - name: Calibre runs and the runner reads its list
        run: |
          docker run --rm --entrypoint ebook-convert forenoon-recipes:ci --list-recipes | grep -q "Financial Times"
          mkdir -m 777 out && : > out/recipes.conf
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL -v "$PWD/out:/recipes" \
            forenoon-recipes:ci once

  web:
    name: Web app checks, image build and smoke test
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true" # queries are checked against web/.sqlx, not a live database
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - run: cargo fmt --check
        working-directory: web
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: web
      - run: cargo test --locked
        working-directory: web
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          tags: forenoon-web:ci
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # Same hardening flags as deploy.sh. An account is created, then the server must
      # answer its own health check.
      - name: Create an account and answer the health check
        run: |
          mkdir -m 777 webdata
          flags="--read-only --tmpfs /tmp --cap-drop ALL -v $PWD/webdata:/data"
          echo "a password for ci" | docker run --rm -i $flags forenoon-web:ci add-user ci --email ci@example.com
          docker run --rm $flags forenoon-web:ci users | grep -q "^ci .*admin .*ci@example.com"
          docker run -d --name web $flags forenoon-web:ci serve
          for i in $(seq 1 20); do
            if docker exec web forenoon-web health; then
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1

  # Publishes to GHCR on push to main (and v* tags); the host polls :latest and
  # redeploys when the digest changes. See docs/setup-deploy.md.
  publish:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [checks, docker, recipes, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest = newest main (what the host deploys); :sha-<commit> to pin a
          # rollback; a git tag v1 publishes :v1 verbatim
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/metadata-action@v6
        id: recipes-meta
        with:
          images: ghcr.io/${{ github.repository }}-recipes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: recipes
          push: true
          tags: ${{ steps.recipes-meta.outputs.tags }}
          labels: ${{ steps.recipes-meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=recipes
          cache-to: type=gha,mode=max,scope=recipes
      - uses: docker/metadata-action@v6
        id: web-meta
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
